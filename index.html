<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Please kog tanaw tanan, Bong</title>
<meta name="theme-color" content="#f7dfe4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div id="petals" aria-hidden="true"></div>

<button id="back" class="fab back" aria-label="Back" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Back</span>
</button>
<button id="mute" class="fab mute" aria-label="Toggle music" hidden>
  <svg id="icOn" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
  <svg id="icOff" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
</button>

<main id="stage"></main>
<div class="progress" id="progress" hidden><i></i></div>

<div id="lightbox" hidden>
  <button class="lb-x" aria-label="Close">✕</button>
  <button class="lb-nav prev" aria-label="Previous">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-nav next" aria-label="Next">›</button>
</div>

<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
